steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/votesmart-web'
      - '--build-arg'
      - 'VITE_GEMINI_API_KEY=${_VITE_GEMINI_API_KEY}'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push image'
    args: ['push', 'gcr.io/$PROJECT_ID/votesmart-web']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'Deploy to Cloud Run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/votesmart-web'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

substitutions:
  _VITE_GEMINI_API_KEY: ''
  _SERVICE_NAME: 'election-assistant'
  _REGION: 'us-central1'

images:
  - 'gcr.io/$PROJECT_ID/votesmart-web'
